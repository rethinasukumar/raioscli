[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raioscli"
version = "0.1.1"
description = "RAIOS - Unified Multi-Cloud + Hypervisor CLI"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "typer",
    "rich",
    "pyyaml",
    "pycdlib"
]

authors = [
    { name = "Rethina Kumar Sukumar" }
]

[project.scripts]
raios = "raioscli.main:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["raioscli*"]

[project.optional-dependencies]
dev = [
    "pytest"
]
